version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incident-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./incident_intelligence.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://localhost:80
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # In Docker, frontend server-side calls go to the backend container
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Internal server-side URL (used by Next.js SSR/API routes)
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
